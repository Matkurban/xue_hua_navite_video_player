name: xue_hua_navite_video_player
description: "A cross-platform Flutter audio/video player plugin powered by native players (ExoPlayer, AVPlayer, mpv)."
version: 2.9.0
homepage: https://github.com/Matkurban
repository: https://github.com/Matkurban/xue_hua_navite_video_player
topics:
  - video
  - video-player
  - player
  - media
  - mp4

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.2
  crypto: ^3.0.8
  path_provider: ^2.1.6
  signals_flutter: ^7.1.0
  chat_context_menu: ^4.2.0
  cupertino_ui: ^1.1.7
  material_ui: ^1.11.1
  ffi: ^2.2.0
  objective_c: ^9.6.4
  jni: ^1.2.1
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0
  signals_lint: ^7.1.0
  pigeon: ^30.0.4
  ffigen: ^22.0.0
  swift2objc: ^0.3.1
  swiftgen: ^0.2.0
  jnigen: ^1.1.0
  path: ^1.9.1
  pub_semver: ^2.2.1
  logging: ^1.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_video_player
        pluginClass: XueHuaNaviteVideoPlayerPlugin
      ios:
        pluginClass: XueHuaNaviteVideoPlayerPlugin
      linux:
        pluginClass: XueHuaNaviteVideoPlayerPlugin
      macos:
        pluginClass: XueHuaNaviteVideoPlayerPlugin
      windows:
        pluginClass: XueHuaNaviteVideoPlayerPluginCApi
      web:
        pluginClass: XueHuaNaviteVideoPlayerWeb
        fileName: xue_hua_navite_video_player_web.dart
