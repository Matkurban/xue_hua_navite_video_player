name: xue_hua_navite_video_player_example
description: "Demonstrates how to use the xue_hua_navite_video_player plugin."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  xue_hua_navite_video_player:
    path: ../

  cupertino_icons: ^2.0.0
  signals_flutter: ^7.1.0
  material_ui: ^1.8.0
  cupertino_ui: ^1.1.4
  flex_color_scheme: ^9.0.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/test.mp4
    - assets/live_photo/motion_city_walk.jpg
    - assets/live_photo/motion_park_pan.jpg
    - assets/live_photo/motion_street_clip.jpg
