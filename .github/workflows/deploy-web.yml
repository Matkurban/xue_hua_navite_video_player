name: Deploy web demo

# Runs only on manual dispatch, or when the `version:` line in pubspec.yaml
# changes on main (saves Actions minutes).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pubspec.yaml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No before sha; treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --depth=1 origin "$BEFORE" || true
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Before sha unavailable; treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          old=$(git show "$BEFORE:pubspec.yaml" 2>/dev/null | grep -m1 '^version:' || true)
          new=$(grep -m1 '^version:' pubspec.yaml || true)
          echo "old='$old' new='$new'"
          if [ "$old" != "$new" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Package analyze
        run: |
          flutter pub get
          flutter analyze
      - name: Example analyze
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Build web
        working-directory: example
        run: flutter build web --release --base-href /xue_hua_navite_video_player/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: example/build/web

  deploy:
    needs: [version-check, build]
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
